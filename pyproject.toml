[project]
name = "nlp-radar"
version = "0.1.0"
description = "Starter repo for Lab 1 of IT 3004 Introduction to NLP: a mini NLP pipeline + Streamlit dashboard."
readme = "README.md"
authors = [
    { name = "ilmagusinac", email = "ilma.gusinac@stu.ibu.edu.ba" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fasttext-wheel>=0.9.2",
    "langdetect>=1.0.9",
    "lingua-language-detector>=2.2.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "sentencepiece>=0.2.2",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "vadersentiment>=3.3.2",
]

# Not a distributable package: students run the code in place with `uv run`.
[tool.uv]
package = false

# CPU-only PyTorch: much smaller download, and the lab needs no GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# `uv run pytest` skips slow tests (they need the downloaded XLM-R model).
# `uv run pytest -m slow` runs only the slow ones: the last -m wins.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: needs a downloaded model and takes a few seconds",
]
